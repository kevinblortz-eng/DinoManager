org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true

# R8 full mode (par défaut sous AGP 8+, explicite pour Google Play)
android.enableR8.fullMode=true

# Opt-out AGP 9 : plugins tiers (file_picker, share_plus, camera...) appliquent encore
# le KGP classique, incompatible avec le built-in Kotlin. À retirer quand tous les
# plugins auront migré vers Built-in Kotlin (voir warning Flutter).
android.builtInKotlin=false
android.newDsl=false
