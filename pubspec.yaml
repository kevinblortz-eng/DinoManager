name: dino_manager
description: ARK Dino Manager – Mobile Smart Breeding
publish_to: 'none'
version: 1.2.27+27

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Base de données locale
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Gestion d'état
  provider: ^6.1.5

  # UI & utilitaires
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  flutter_colorpicker: ^1.1.0
  google_fonts: ^8.0.2
  cached_network_image: ^3.4.1

  # Export / partage
  share_plus: ^13.3.1
  file_picker: ^13.4.0

  # Icônes
  cupertino_icons: ^1.0.8

  # Excel
  excel: ^4.0.6

  # OCR & médias
  google_mlkit_text_recognition: ^0.15.1
  image_picker: ^1.1.2
  image: ^4.3.0
  camera: ^0.11.0+2

  # Permissions & divers
  permission_handler: ^12.0.1
  uuid: ^4.0.0
  saver_gallery: ^4.0.0
  device_info_plus: ^13.3.0
  http: ^1.5.0

  material_ui: ^1.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/dinos/
    - assets/icons/
    - assets/icons/currencies/
    - assets/images/flame_background.png
    - assets/images/ui/ark_header_bg.png
    - assets/images/ui/background_cmd.png
    - assets/images/ui/background_home.png
    - assets/images/ui/share_card_bg.png
    - assets/images/ui/share_card_portrait_bg.png
    - assets/images/ui/share_card_portrait_bg_fantastic.png
    - assets/images/ui/share_card_portrait_bg_air.png
    - assets/images/ui/share_card_portrait_bg_aqua.png
    - assets/icons/damage.png
    - assets/icons/hp.png
    - assets/icons/stamina.png
    - assets/icons/oxygen.png
    - assets/icons/food.png
    - assets/icons/weight.png
    - assets/data/ark_species.json
    - assets/images/shop.png 

