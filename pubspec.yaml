name: dino_manager
description: ARK Dino Manager – Mobile Smart Breeding
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Base de données locale (web + Android)
  hive: 2.2.3
  hive_flutter: 1.1.0
  path_provider: ^2.1.2
  # Gestion d'état
  provider: 6.1.5+1
  # UI & utilitaires
  shared_preferences: 2.5.3
  intl: ^0.19.0
  flutter_colorpicker: ^1.1.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  # Export / partage de données
  share_plus: ^10.1.4
  file_picker: ^8.3.7
  # Icônes
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/dinos/
    - assets/icons/
